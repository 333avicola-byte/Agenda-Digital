<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#0a3f91">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Agenda IA Porcina</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap">
<style>
/* Layout: single blue gradient field (as in the invitation), logos in the top corners, title, then one white square to write in. Single look on purpose. */
:root{
  --blue:#0a3f91; --blue-deep:#06306f; --mist:#9fb3c4; --paper:#ffffff; --ink:#10203a; --hint:#9aa6b8; --btn:#1f6db1;
  --f:'Montserrat',-apple-system,system-ui,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{font-family:var(--f);color:#fff;background:var(--blue);
  background-image:radial-gradient(120% 80% at 0% 100%,var(--mist) 0%,rgba(159,179,196,0) 55%),linear-gradient(160deg,var(--blue) 0%,var(--blue-deep) 60%,#1f5f9e 100%);
  background-attachment:fixed}
.page{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 28px}
.corners{display:flex;justify-content:space-between;align-items:center}
.corners img{height:44px;width:auto}
h1{font-size:clamp(24px,6vw,34px);line-height:1.15;font-weight:800;margin:22px 0 18px;text-align:center;text-wrap:balance}
.sheet{background:var(--paper);color:var(--ink);border-radius:6px;aspect-ratio:1/1;width:100%;max-width:100%;
  box-shadow:0 18px 40px rgba(3,20,55,.35);padding:22px;display:flex}
textarea{flex:1;width:100%;border:0;resize:none;background:transparent;color:var(--ink);font:inherit;font-size:17px;line-height:1.55;padding:0}
textarea::placeholder{color:var(--hint)}
textarea:focus{outline:none}
.actions{display:flex;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.msg{flex:1;font-size:13px;opacity:.85;min-width:0}
.inapp{background:#fff;color:#0a3f91;border-radius:10px;padding:10px 12px;margin-top:14px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}
.inapp span{flex:1;min-width:0}
.inapp button{padding:8px 12px;font-size:13px;background:#0a3f91;color:#fff}
button{font:inherit;font-weight:700;font-size:15px;border:0;border-radius:8px;padding:12px 20px;background:var(--paper);color:var(--blue);cursor:pointer}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
@media (max-width:600px){
  body{background-attachment:scroll}
  .page{height:100vh;height:100dvh;min-height:0;padding-block:max(12px,env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-bottom,0px))}
  .corners img{height:28px}
  h1{font-size:20px;margin:12px 0 10px}
  .inapp{margin-top:10px}
  .sheet{aspect-ratio:auto;flex:1 1 auto;min-height:180px;height:auto;padding:16px;border-radius:12px}
  textarea{font-size:16px}
  .actions{margin-top:12px;flex-direction:column-reverse;align-items:stretch;gap:6px}
  .actions button{width:100%;padding:14px;font-size:15px}
  .msg{text-align:center;min-height:16px}
}
</style>

0";
const ta=document.getElementById("nota"), msg=document.getElementById("msg");
/* Guardado inmediato en dos lugares (localStorage + IndexedDB) */
let idb=null;
try{const r=indexedDB.open("notas-ia",1);r.onupgradeneeded=()=>r.result.createObjectStore("n");r.onsuccess=()=>{idb=r.result;
  if(!ta.value){const g=idb.transaction("n").objectStore("n").get(KEY);g.onsuccess=()=>{if(g.result&&!ta.value)ta.value=g.result;};}};}catch(e){}
function persist(){const v=ta.value;try{localStorage.setItem(KEY,v)}catch(e){}
  try{if(idb)idb.transaction("n","readwrite").objectStore("n").put(v,KEY)}catch(e){}}
try{ta.value=localStorage.getItem(KEY)||""}catch(e){}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
ta.addEventListener("input",persist);
ta.addEventListener("blur",persist);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")persist();});
window.addEventListener("pagehide",persist);
window.addEventListener("beforeunload",persist);
/* Aviso si se abrió dentro de otra app (Google, Lens, WhatsApp, Instagram...) */
(function(){const ua=navigator.userAgent||"";
  const inApp=/GSA\/|FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)|LinkedInApp/i.test(ua);
  if(!inApp)return;const ios=/iPhone|iPad|iPod/.test(ua);
  const b=document.getElementById("inapp");b.hidden=false;
  document.getElementById("inappTxt").textContent="Para no perder tus notas, abrí este link en "+(ios?"Safari":"Chrome")+".";
  document.getElementById("inappBtn").onclick=async()=>{try{await navigator.clipboard.writeText(location.href);document.getElementById("inappBtn").textContent="Link copiado";}catch(e){document.getElementById("inappTxt").textContent="Copiá este link: "+location.href;}};
})();
function buildPDF(){const {jsPDF}=window.jspdf;const d=new jsPDF({unit:"mm",format:"a4"});const W=210,M=18;let y;
  const head=()=>{d.setFillColor(10,63,145);d.rect(0,0,W,44,"F");
    try{d.addImage(L333,"PNG",M,8,24,14);d.addImage(LSAN,"PNG",W-M-17.8,7,17.8,16);}catch(e){}
    d.setTextColor(255,255,255);d.setFont("helvetica","bold");d.setFontSize(13);
    d.text("Inteligencia artificial para empresas de producción porcina",W/2,35,{align:"center"});y=58;};
  head();d.setFont("helvetica","normal");d.setFontSize(11);d.setTextColor(16,32,58);
  d.splitTextToSize(ta.value.trim()||" ",W-2*M).forEach(l=>{if(y>282){d.addPage();head();d.setFont("helvetica","normal");d.setFontSize(11);d.setTextColor(16,32,58);}d.text(l,M,y);y+=5.8;});
  return d.output("blob");}
function restore(){if(ta.value)return;let v="";try{v=localStorage.getItem(KEY)||""}catch(e){}
  if(v){ta.value=v;return;}
  try{if(idb){const g=idb.transaction("n").objectStore("n").get(KEY);g.onsuccess=()=>{if(g.result&&!ta.value)ta.value=g.result;};}}catch(e){}}
window.addEventListener("pageshow",restore);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")restore();});
const NAME="Mis notas - IA en produccion porcina.pdf";
const mobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
document.getElementById("pdf").onclick=async()=>{
  persist();
  if(!window.jspdf){msg.textContent="No se pudo generar el PDF. Revisá tu conexión.";return;}
  let blob;try{blob=buildPDF();}catch(e){msg.textContent="No se pudo generar el PDF";return;}
  const file=new File([blob],NAME,{type:"application/pdf"});
  /* En el celular: menú de compartir (Guardar en Archivos, WhatsApp, Mail) sin salir de la página */
  if(mobile&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:"Mis notas"});msg.textContent="Listo. Tus notas siguen acá.";return;}
    catch(e){if(e&&e.name==="AbortError"){msg.textContent="";return;}}
  }
  /* Resto: descarga en otra pestaña para no tocar esta */
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=NAME;a.target="_blank";a.rel="noopener";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  msg.textContent="PDF descargado. Tus notas siguen acá.";
};
</script>
